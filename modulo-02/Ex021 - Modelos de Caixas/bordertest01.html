<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>border</title>
    <style>
        h1 {
  border-left: 5px solid #ff5722; /* Linha grossa laranja à esquerda */
  padding-left: 12px;             /* Afasta o texto da linha */
}
h1 {
  border: 2px dashed #333; /* Borda tracejada ao redor de todo o h1 */
  border-radius: 8px;       /* Pontas arredondadas */
  padding: 10px 20px;
  display: inline-block;    /* Faz a borda se ajustar ao tamanho do texto */
}
h1 {
  border: 1px solid red; /* Ajuda a ver exatamente onde o h1 começa e termina */
}

    </style>
</head>
<body>
    <h1>TESTE DE BORDER BOX</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Laboriosam dolores consequuntur eveniet ipsam tempora? Velit asperiores, praesentium dolorum omnis inventore eligendi facilis autem iste odio blanditiis perferendis ex. Saepe, maiores!</p>
</body>
</html>
