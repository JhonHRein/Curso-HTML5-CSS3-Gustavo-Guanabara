<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden; /* Evita qualquer barra de rolagem horizontal indesejada */
        }

        /* Oculta a barra de rolagem no Chrome, Safari e Opera */
        ::-webkit-scrollbar {
            width: 0px;
            height: 0px;
            display: none;
        }

        img {
            width: 100%;
            display: block; /* Remove espaços fantasmas abaixo da imagem */
        }

        a {
            display: block;
            background-color: rgb(5, 5, 5);
            color: white;
            padding: 20px;
            text-align: center;
            font-weight: bolder;
            text-decoration: none;
        }
        a:hover {
            background-color: rgb(48, 47, 47);
        }

    </style>
</head>
<body>
     <img src="imagens/tela-github.jpg" alt="GitHub"><a href="https://github.com/gustavoguanabara" target="_blank">CLIQUE AQUI</a>
</body>
</html>
