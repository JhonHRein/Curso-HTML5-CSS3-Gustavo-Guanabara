<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <!-- Controle-->
    <h1>Teste de formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on"></form>
    <p>
        <label for="inome">Nome</label>
        <input type="text" name="nome" id="inome" required maxlength="30" placeholder="Nome completo" autocomplete="name" required>
    </p>
    <p>
        <label for="imedia">Media</label>
        <input type="number" name="media" id="imedia" min="0" max="10" placeholder="0 a 10" step="0.1" value="5" required>

    </p>
    <p>
        <label for="imes">Período Letivo</label>
        <input type="month" name="mes" id="imes"  value="2026-10-22">
    </p>
    <p>
        <label for="idata">Data da Prova</label>
        <input type="date" name="data" id="idata" value="2026-10-22">
    </p>
    
    <p>
        <label for="ihorario">Horário da Aula</label>
        <input type="time" name="horario" id="ihorario">
    </p>
    
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
   
    
</body>
</html>
