<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento vertical</title>
    <style>

        #container {
            background-image: url(imagens/target001.png);
            background-size: 100% 100%;
            
            position: relative; /* Container sempre relativo*/
            height: 98vh;
            padding: 10px;
            background-color: purple;

        }

        #conteudo {
            background-image: url(imagens/target001.png);
            background-size: 100% 100%;
           
            position: absolute; /**/
            height: 200px;
            width: 400px;
            background-color:  yellow;

            left: 50%; /*So trabalha nas posiçoes aqui se o postion for absoluto*/
            top: 50%;
           
            transform: translate(-200px, -100px); /*Movimentaçao de elemento*/
        
            
        }
    </style>
</head>
<body>
    <section id="container">
        <article id="conteudo">

        </article>
    </section>
    
</body>
</html>
