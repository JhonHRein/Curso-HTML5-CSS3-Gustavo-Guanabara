<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styletabela002.css">
    <title>Tabelas 02</title>
</head>
<body>
    <!-- ANATOMIA PARA TABELAS GRANDES
        TABLE
            CAPTION
            TR,TD,TH
        THEAD
            TR,TD,TH
        TBODY
            TR,TD,TH
        TFOOT
            TR,TD,TH -->
</body>
    <h1>Uso de tabelas grandes</h1>
    <table>
        <caption>População das Unidades Federativas</caption>
        <thead>
            <th scope="col">Estado</th>
            <th scope="col" style="width: 50px;">População</th>
        </thead>
        
        <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="num">45 919 049</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td class="num">21 168 791</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td class="num">17 264 943</td>
            </tr>
            <tr>
                <td>Acre</td>
                <td class="num">881.731</td>
            </tr>
            <tr>
                <td>Amapá</td>
                <td class="num">264.943</td>
            </tr>
            <tr>
                <td>Rondonia</td>
                <td class="num">785.943</td>
            </tr>
            <tr>
                <td>Mato Grosso</td>
                <td class="num">2 681.531</td>
            </tr>
            <tr>
                <td>Paraiba</td>
                <td class="num">2 181.431</td>
            </tr>
            <tr>
                <td>Maranhão</td>
                <td class="num">1 851.331</td>
            </tr>
        </tbody>
        
        <tfoot>
            <th scope="row">Total de Habitantes</th>
            <td class="num">86.285.400</td>
        </tfoot>
    </table>
</html>
