<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas em HTML </title>
    <link rel="stylesheet" href="styletabela001.css">
</head>
<body>
    <h1>Minha Primeira tabela</h1>

        <!-- Hierarquia de tabelas (simples)
            Table = tabela
            tr = table row = linhas de tabela
            table header = cabeçalho de tabela
            td = table data = tabela de dados  -->
   <table>
    <tr class="linha"> <!--Primeira Linha-->
        <td>A1</td>
        <td>B1</td>
        <td>C1</td>
    </tr>
    
    <tr> <!--Segunda Linha-->
        <td>A2</td> 
        <td class="dado">B2</td>
        <td class="numero">C2</td>
    </tr>
    
    <tr> <!--Terceira Linha-->
        <td>A3</td>
        <td class="numero">B3</td>
        <td>C3</td>
    </tr>
    
    <tr> <!--Quarta Linha-->
        <td>A4</td>
        <td>B4</td>
        <td>C4</td>
    </tr>
   </table>
    
</body>
</html>
